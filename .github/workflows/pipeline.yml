name: pipeline

on:
  workflow_dispatch:
  # Enable only after credentials are configured and a manual run succeeds.
  # schedule:
  #   - cron: '15 5 * * *'

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - run: npm run setup:bq
      - run: npm run pipeline
